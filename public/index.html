<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Report</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --panel-2: #1b212a;
    --line: #262e39;
    --text: #dce3ec;
    --muted: #8794a5;
    --accent: #4c9aff;
    --green: #36b37e;
    --amber: #ffab00;
    --red: #ff5630;
    --purple: #b57aff;
    --gray: #6b7684;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .02em; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(54,179,126,.18); }
  .run-list { overflow-y: auto; flex: 1; padding: 8px; }
  .run-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 10px; color: inherit; font: inherit; margin-bottom: 4px;
  }
  .run-item:hover { background: var(--panel-2); }
  .run-item.active { background: var(--panel-2); border-color: #2f3a49; }
  .run-item .t { font-weight: 560; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .m { display: flex; align-items: center; gap: 6px; margin-top: 5px; color: var(--muted); font-size: 11px; }
  .run-item .bar { height: 3px; background: #232b36; border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .run-item .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #detail { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .head { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg,#141a22,#11161d); }
  .head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .head .meta { color: var(--muted); font-size: 12px; margin-top: 7px; display: flex; gap: 16px; flex-wrap: wrap; }
  .head .meta b { color: var(--text); font-weight: 550; }

  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid transparent; text-transform: uppercase; letter-spacing: .04em;
  }
  .chip.running { background: rgba(76,154,255,.14); color: #79b6ff; border-color: rgba(76,154,255,.35); }
  .chip.waiting, .chip.blocked { background: rgba(255,171,0,.14); color: #ffc94d; border-color: rgba(255,171,0,.35); }
  .chip.error, .chip.failed { background: rgba(255,86,48,.14); color: #ff8368; border-color: rgba(255,86,48,.38); }
  .chip.done { background: rgba(54,179,126,.14); color: #5cd6a0; border-color: rgba(54,179,126,.35); }
  .chip.aborted { background: rgba(107,118,132,.16); color: #9aa6b5; border-color: rgba(107,118,132,.4); }
  .chip.demo { background: rgba(181,122,255,.16); color: #cda8ff; border-color: rgba(181,122,255,.45); cursor: default; }

  .progress-wrap { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  /* Scoped to the header bar: a bare `.progress` would also hit the `kind progress` badge. */
  .progress-wrap .progress { flex: 1; height: 7px; background: #212934; border-radius: 5px; overflow: hidden; }
  .progress-wrap .progress i { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#4c9aff); transition: width .3s; }
  .progress-wrap .progress.indet i { width: 35% !important; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  .progress-label { font-size: 12px; color: var(--muted); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { border-color: #3a4657; }
  .btn.on { background: rgba(76,154,255,.16); border-color: rgba(76,154,255,.5); color: #9cc7ff; }
  .seg { display: flex; gap: 4px; }

  .timeline { overflow-y: auto; flex: 1; padding: 18px 24px 60px; min-height: 0; }
  .entry { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px dashed #1f2732; }
  .entry:last-child { border-bottom: 0; }
  .entry .when { color: var(--muted); font-size: 11px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .entry .body { min-width: 0; }
  .kind {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 7px; border-radius: 4px; margin-right: 8px; vertical-align: 1px;
  }
  .kind.start { background: rgba(181,122,255,.16); color: #cda8ff; }
  .kind.progress { background: rgba(76,154,255,.16); color: #8bbcff; }
  .kind.status { background: rgba(255,171,0,.16); color: #ffcd57; }
  .kind.log { background: rgba(135,148,165,.16); color: #a5b1c1; }
  .kind.result { background: rgba(54,179,126,.18); color: #63dca9; }
  .kind.end { background: rgba(255,86,48,.16); color: #ff8a70; }
  .lv { font-size: 11px; font-weight: 700; margin-right: 6px; }
  .lv.debug { color: var(--gray); } .lv.info { color: var(--accent); }
  .lv.warn { color: var(--amber); } .lv.error { color: var(--red); }
  .msg { word-break: break-word; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-word; }

  details { margin-top: 7px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  details summary:hover { color: var(--text); }
  pre {
    margin: 7px 0 0; padding: 10px 12px; background: #0b0f14; border: 1px solid var(--line);
    border-radius: 7px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    color: #b9c5d4; max-height: 340px;
  }

  .mini-progress { margin-top: 7px; height: 5px; background: #212934; border-radius: 4px; overflow: hidden; max-width: 420px; }
  .mini-progress i { display: block; height: 100%; background: var(--accent); }

  .result-card {
    background: linear-gradient(180deg,#16231d,#131a20); border: 1px solid rgba(54,179,126,.32);
    border-radius: 10px; padding: 14px 16px; margin-top: 4px;
  }
  .result-card h4 { margin: 0; font-size: 14px; color: #7ee6b8; }
  .result-card .sum { margin-top: 7px; color: #cfd8e3; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .metric { background: #101820; border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; min-width: 120px; }
  .metric .k { color: var(--muted); font-size: 11px; }
  .metric .v { font-size: 16px; font-weight: 640; font-variant-numeric: tabular-nums; }
  .metric .u { font-size: 11px; color: var(--muted); margin-left: 3px; }
  ul.art { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 6px; }
  ul.art li { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; flex-wrap: wrap; }
  ul.art .nm { color: #9cc7ff; }
  ul.art .pth { color: var(--muted); word-break: break-all; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .links a { color: var(--accent); font-size: 12.5px; }

  .artimg { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin-top: 8px; }
  .arthtml { width: 100%; min-height: 480px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-top: 8px; }
  .md-body { margin-top: 9px; color: #cfd8e3; font-size: 13.5px; }
  .md-body h3, .md-body h4, .md-body h5, .md-body h6 { margin: 12px 0 6px; color: var(--text); }
  .md-body h3 { font-size: 16px; } .md-body h4 { font-size: 15px; } .md-body h5 { font-size: 14px; }
  .md-body p { margin: 7px 0; }
  .md-body ul, .md-body ol { margin: 7px 0; padding-left: 22px; }
  .md-body li { margin: 3px 0; }
  .md-body blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid rgba(76,154,255,.5); color: var(--muted); background: rgba(76,154,255,.06); border-radius: 0 6px 6px 0; }
  .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .md-body a { color: var(--accent); }
  .md-body img { max-width: 100%; border-radius: 8px; }
  .md-body code { background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .md-body pre.mdcode { margin: 9px 0; padding: 10px 12px; background: #0b0f14; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: #b9c5d4; }
  .md-body pre.mdcode code { background: none; border: 0; padding: 0; }

  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px; max-width: 620px; }
  .empty h3 { color: var(--text); margin: 0 0 10px; }
  .empty pre { text-align: left; display: inline-block; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  #myPanels { border-bottom: 1px solid var(--line); padding: 8px 10px; }
  #myPanels .lbl { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  #myPanels .mp-add { display: flex; gap: 6px; }
  #myPanels input {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 11px; padding: 4px 8px;
  }
  #myPanels input:focus { outline: none; border-color: rgba(76,154,255,.5); }
  .mp-item {
    display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px;
    color: #9cc7ff; text-decoration: none; word-break: break-all;
  }
  .mp-item:hover { text-decoration: underline; }
  .mp-del {
    background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 4px; flex: none;
  }
  .mp-del:hover { color: var(--red); }
  .mp-err { color: #ff8368; font-size: 11px; margin-top: 5px; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 34vh; }
    .entry { grid-template-columns: 1fr; }
    .entry .when { text-align: left; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span><h1>Agent Report</h1><span class="chip demo hidden" id="modeChip" title="静态演示站点，数据为示例">DEMO</span><span class="spacer" style="flex:1"></span><span class="muted" id="runCount" style="font-size:11px"></span></div>
    <div id="myPanels" class="hidden">
      <div class="lbl">我的面板</div>
      <div class="mp-add">
        <input id="mpUrl" placeholder="http://127.0.0.1:7788" spellcheck="false" />
        <button class="btn" id="mpAdd">添加</button>
      </div>
      <div id="mpList"></div>
    </div>
    <div class="run-list" id="runList"></div>
  </aside>

  <main>
    <div class="empty" id="empty">
      <h3>还没有汇报</h3>
      <p>把 MCP server 挂到 agent 上之后，agent 调用 <code>report_progress</code> / <code>report_result</code> 等工具，记录会实时出现在这里。</p>
      <pre class="mono">{
  "mcpServers": {
    "report": {
      "command": "node",
      "args": ["/absolute/path/report_mcp/dist/index.js"]
    }
  }
}</pre>
      <p class="muted">存储位置：<code id="homePath">–</code></p>
    </div>

    <div id="detail" class="hidden">
      <div class="head">
        <div class="row">
          <h2 id="rTitle">–</h2>
          <span class="chip running" id="rStatus">running</span>
        </div>
        <div class="meta" id="rMeta"></div>
        <div class="progress-wrap">
          <div class="progress" id="rProgress"><i style="width:0%"></i></div>
          <div class="progress-label" id="rProgressLabel"></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="seg" id="filters">
          <button class="btn on" data-f="all">全部</button>
          <button class="btn" data-f="progress">进度</button>
          <button class="btn" data-f="log">日志</button>
          <button class="btn" data-f="result">结果</button>
          <button class="btn" data-f="status">状态</button>
        </div>
        <span class="spacer"></span>
        <button class="btn on" id="followBtn">自动滚动</button>
        <button class="btn" id="copyBtn">复制链接</button>
      </div>

      <div class="timeline" id="timeline"></div>
    </div>
  </main>
</div>

<script>
(async () => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const fmtDur = (ms) => {
    if (ms == null || !isFinite(ms)) return "–";
    const s = Math.round(ms / 1000);
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m " + (s % 60) + "s";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  };
  const clock = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour12: false }); } catch { return ""; } };
  const ago = (iso) => {
    const d = Date.now() - Date.parse(iso);
    if (!isFinite(d)) return "";
    if (d < 60000) return Math.max(0, Math.round(d / 1000)) + "s 前";
    if (d < 3600000) return Math.round(d / 60000) + "m 前";
    if (d < 86400000) return Math.round(d / 3600000) + "h 前";
    return new Date(iso).toLocaleDateString();
  };
  const pretty = (v) => {
    if (typeof v === "string") return v;
    try { return JSON.stringify(v, null, 2); } catch { return String(v); }
  };
  const details = (label, v) =>
    v == null || v === "" ? "" :
      `<details><summary>${esc(label)}</summary><pre>${esc(pretty(v))}</pre></details>`;

  /* ---------------- rich result rendering (markdown / html / images) ---------------- */

  /** Escape-first, zero-dependency markdown subset renderer. Returns trusted HTML. */
  function renderMarkdown(src) {
    const stash = [];
    const hold = (html) => { stash.push(html); return "\u0000" + (stash.length - 1) + "\u0000"; };
    let s = String(src == null ? "" : src).replace(/\r\n/g, "\n");
    s = s.replace(/```[^\n]*\n?([\s\S]*?)(?:```|$)/g, (_m, body) =>
      hold(`<pre class="mdcode"><code>${esc(String(body).replace(/\n+$/, ""))}</code></pre>`));
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, (_m, c) => hold(`<code>${c}</code>`));
    const safeUrl = (u) => {
      const d = u.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<");
      return /^(https?:|mailto:)/i.test(d) ? d : null;
    };
    const inline = (t) => t
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m0, alt, u) => {
        const d = safeUrl(u);
        return d ? `<img src="${d}" alt="${alt}">` : m0;
      })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m0, txt, u) => {
        const d = safeUrl(u);
        return d ? `<a href="${d}" target="_blank" rel="noreferrer">${txt}</a>` : m0;
      })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    const out = [];
    let para = [], list = null, quote = null;
    const fp = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
    const fl = () => { if (list) { out.push((list.o ? "<ol>" : "<ul>") + list.items.map((x) => `<li>${inline(x)}</li>`).join("") + (list.o ? "</ol>" : "</ul>")); list = null; } };
    const fq = () => { if (quote) { out.push(`<blockquote>${inline(quote.join(" "))}</blockquote>`); quote = null; } };
    const flushAll = () => { fp(); fl(); fq(); };
    for (const line of s.split("\n")) {
      const t = line.trim();
      let m;
      if (/^\u0000\d+\u0000$/.test(t)) { flushAll(); out.push(t); continue; }
      if (!t) { flushAll(); continue; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { flushAll(); out.push(`<h${Math.min(6, m[1].length + 2)}>${inline(m[2])}</h${Math.min(6, m[1].length + 2)}>`); continue; }
      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushAll(); out.push("<hr>"); continue; }
      if ((m = /^\s*&gt;\s?(.*)$/.exec(line))) { fl(); fp(); (quote = quote || []).push(m[1]); continue; }
      if ((m = /^\s*[-*+]\s+(.*)$/.exec(line))) {
        fp(); fq();
        if (list && list.o) fl();
        (list = list || { o: false, items: [] }).items.push(m[1]);
        continue;
      }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
        fp(); fq();
        if (list && !list.o) fl();
        (list = list || { o: true, items: [] }).items.push(m[1]);
        continue;
      }
      fl(); fq(); para.push(t);
    }
    flushAll();
    return out.join("\n").replace(/\u0000(\d+)\u0000/g, (_m, i) => stash[Number(i)] || "");
  }

  // Wildcard sources never cover `style=` attributes — 'unsafe-inline' must be spelled out
  // or every inline-styled agent HTML renders unstyled. Script risk stays contained by the
  // sandbox attribute (opaque origin), not by this list.
  const FRAME_CSP = '<meta http-equiv="Content-Security-Policy" content="default-src *; script-src * \'unsafe-inline\'; style-src * \'unsafe-inline\'; img-src * data:;">';
  function withCsp(html) {
    const s = String(html);
    if (/<meta\s+http-equiv=["']?content-security-policy/i.test(s)) return s;
    if (/<head[^>]*>/i.test(s)) return s.replace(/<head[^>]*>/i, (m) => m + FRAME_CSP);
    if (/<html[^>]*>/i.test(s)) return s.replace(/<html[^>]*>/i, (m) => m + "<head>" + FRAME_CSP + "</head>");
    return FRAME_CSP + s;
  }
  /** Scripts run inside, but `sandbox="allow-scripts"` (no allow-same-origin) keeps the frame an opaque origin. */
  const htmlIframe = (src) => `<iframe class="arthtml" sandbox="allow-scripts" srcdoc="${esc(withCsp(src))}"></iframe>`;

  /** URL for an artifact rendered inline, or null when it must stay a plain link. */
  function inlineAsset(r, a, i) {
    if (a.url || !a.path) return null;
    const t = String(a.type || "").toLowerCase();
    let href = null;
    if (DS.kind === "live") {
      href = "/api/file?run=" + encodeURIComponent(state.runId) + "&seq=" + r.seq + "&i=" + i;
    } else if (/^assets\/[\w./-]+$/.test(a.path)) {
      href = a.path; // demo assets deployed next to the hosted panel
    }
    if (!href) return null;
    if (t === "image") return { kind: "image", href };
    if (t === "markdown" || t === "text") return { kind: "md", href };
    if (t === "html") return { kind: "html", href };
    return null;
  }

  /** Fill the data-md-src / data-html-src placeholders the last render left behind. */
  function hydrate(box) {
    for (const el of Array.from(box.querySelectorAll("[data-md-src],[data-html-src]"))) {
      const isMd = el.hasAttribute("data-md-src");
      const src = el.getAttribute(isMd ? "data-md-src" : "data-html-src");
      el.removeAttribute(isMd ? "data-md-src" : "data-html-src");
      fetch(src).then((res) => {
        if (!el.isConnected) return;
        if (!res.ok) { el.innerHTML = `<span class="muted">（加载失败：HTTP ${esc(res.status)}）</span>`; return; }
        return res.text().then((text) => {
          if (!el.isConnected) return;
          if (isMd) el.innerHTML = renderMarkdown(text);
          else el.outerHTML = htmlIframe(text);
        });
      }).catch(() => {
        if (el.isConnected) el.innerHTML = '<span class="muted">（加载失败）</span>';
      });
    }
  }

  // Mirror of the server-side summariser, so the header updates instantly on SSE.
  function derive(runId, records) {
    const starts = records.filter((r) => r.kind === "start");
    const start = starts[starts.length - 1];
    let status = "running";
    for (const r of records) {
      if (r.kind === "status") status = r.status;
      else if (r.kind === "end") status = r.status;
    }
    const logCounts = { debug: 0, info: 0, warn: 0, error: 0 };
    let resultCount = 0, lastError, failureSummary, progress;
    for (const r of records) {
      if (r.kind === "log") { logCounts[r.level]++; if (r.level === "error") lastError = r.message; }
      else if (r.kind === "status" && r.status === "error" && r.message) lastError = r.message;
      else if (r.kind === "result") resultCount++;
      else if (r.kind === "progress") progress = { phase: r.phase, percent: r.percent ?? null, step: r.step, totalSteps: r.totalSteps, message: r.message };
      else if (r.kind === "end" && r.status !== "done" && r.summary) failureSummary = r.summary;
    }
    const first = records[0], last = records[records.length - 1];
    const end = last && last.kind === "end" ? last : null;
    const startedAt = (start && start.ts) || (first && first.ts);
    return {
      runId,
      title: (start && start.title) || "Untitled run",
      agent: start && start.agent,
      tags: start && start.tags,
      status,
      startedAt,
      updatedAt: last && last.ts,
      endedAt: end && end.ts,
      durationMs: end && end.durationMs != null ? end.durationMs
        : startedAt ? Date.parse((last && last.ts) || startedAt) - Date.parse(startedAt) : undefined,
      recordCount: records.length,
      progress, logCounts, resultCount, lastError, failureSummary,
    };
  }

  const state = {
    runs: [], runId: null, records: [], summary: null,
    filter: "all", follow: true, es: null,
  };

  /**
   * Data source.
   *
   * `live`   — a report-mcp backend answered /api/runs: full REST + SSE.
   * `static` — no backend (GitHub Pages, or the backend died): fall back to the
   *            bundled demo-data.js and render entirely from memory.
   *
   * The demo ships raw records only; RunSummary is always derived locally with
   * the same `derive()` the live path uses, so the two can never disagree.
   */
  const DS = {
    kind: "live",
    demo: null,

    async detect() {
      try {
        const res = await fetch("/api/runs", { cache: "no-store" });
        const ct = res.headers.get("content-type") || "";
        if (res.ok && ct.includes("json")) {
          this.kind = "live";
          return;
        }
      } catch {
        /* no backend */
      }
      this.kind = "static";
      await this.loadDemo();
    },

    loadDemo() {
      return new Promise((resolve) => {
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          this.demo = window.__REPORT_DEMO__ || null;
          resolve();
        };
        const s = document.createElement("script");
        s.src = "demo-data.js";
        s.onload = finish;
        s.onerror = finish;
        document.head.appendChild(s);
        // Never let a stalled script tag block the whole panel from booting.
        // demo-data.js is same-origin on a static host, so 2s is generous.
        const timer = setTimeout(finish, 2000);
      });
    },

    entries() {
      return (this.demo && this.demo.runs) || [];
    },

    listRuns() {
      return this.entries()
        .map((e) => derive(e.runId, e.records))
        .sort((a, b) => Date.parse(b.updatedAt ?? b.startedAt ?? "0") - Date.parse(a.updatedAt ?? a.startedAt ?? "0"));
    },

    getRun(id) {
      const e = this.entries().find((x) => x.runId === id);
      return e ? { summary: derive(id, e.records), records: e.records } : null;
    },
  };

  let reloadTimer = null;
  const reloadRuns = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadRuns, 600); };

  async function loadRuns() {
    if (DS.kind === "static") {
      state.runs = DS.listRuns();
    } else {
      try {
        const res = await fetch("/api/runs");
        state.runs = await res.json();
      } catch { state.runs = []; }
    }
    renderList();
    if (!state.runId && state.runs.length) open(state.runs[0].runId, false);
  }

  async function loadRun(id) {
    let data = null;
    if (DS.kind === "static") {
      data = DS.getRun(id);
    } else {
      try {
        const res = await fetch("/api/runs/" + encodeURIComponent(id));
        if (res.ok) data = await res.json();
      } catch { data = null; }
    }
    if (state.runId !== id) return;
    if (!data) {
      state.records = [];
      state.summary = null;
      render();
      return;
    }
    state.records = data.records || [];
    state.summary = data.summary;
    render();
  }

  function subscribe(id) {
    if (state.es) { state.es.close(); state.es = null; }
    if (DS.kind !== "live") return;   // static builds have nothing to stream
    if (!window.EventSource) return;
    const es = new EventSource("/api/stream?run=" + encodeURIComponent(id));
    es.addEventListener("record", (e) => {
      if (state.runId !== id) return;
      let rec; try { rec = JSON.parse(e.data); } catch { return; }
      if (state.records.some((x) => x.id === rec.id)) return;
      state.records.push(rec);
      state.records.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
      state.summary = derive(id, state.records);
      renderHead(); renderTimeline();
    });
    es.addEventListener("runs", () => { if (state.runId === id) loadRun(id); reloadRuns(); });
    es.onerror = () => { /* EventSource retries on its own */ };
    state.es = es;
  }

  function open(id, push) {
    state.runId = id;
    state.records = [];
    state.summary = derive(id, []);
    if (push) location.hash = "#/run/" + encodeURIComponent(id);
    render(); subscribe(id); loadRun(id); loadRuns();
  }

  /* ---------------- rendering ---------------- */

  function render() {
    const has = !!state.runId;
    $("empty").classList.toggle("hidden", has);
    $("detail").classList.toggle("hidden", !has);
    renderList(); renderHead(); renderTimeline();
  }

  function renderList() {
    $("runCount").textContent = state.runs.length ? state.runs.length + " runs" : "";
    const box = $("runList");
    if (!state.runs.length) { box.innerHTML = '<div class="muted" style="padding:12px;font-size:12px">暂无运行记录</div>'; return; }
    box.innerHTML = state.runs.map((r) => {
      const pct = r.progress && r.progress.percent != null ? r.progress.percent : null;
      const bar = pct != null
        ? `<div class="bar"><i style="width:${esc(pct)}%"></i></div>`
        : (r.progress ? `<div class="bar"><i style="width:18%;opacity:.5"></i></div>` : "");
      const err = (r.lastError || r.failureSummary) ? `<span class="chip error" style="text-transform:none">err</span>` : "";
      return `<button class="run-item${r.runId === state.runId ? " active" : ""}" data-run="${esc(r.runId)}">
        <div class="t">${esc(r.title)}</div>
        <div class="m"><span class="chip ${esc(r.status)}">${esc(r.status)}</span>
          <span>${esc(r.updatedAt ? ago(r.updatedAt) : "")}</span>${err}</div>
        ${bar}
      </button>`;
    }).join("");
    box.querySelectorAll(".run-item").forEach((b) =>
      b.addEventListener("click", () => open(b.dataset.run, true)));
  }

  function renderHead() {
    const s = state.summary;
    if (!s) return;
    $("rTitle").textContent = s.title || "Untitled run";
    const chip = $("rStatus");
    chip.textContent = s.status;
    chip.className = "chip " + s.status;

    const bits = [];
    if (s.agent) bits.push(`<span>agent <b>${esc(s.agent)}</b></span>`);
    if (s.startedAt) bits.push(`<span>开始 <b>${esc(clock(s.startedAt))}</b></span>`);
    bits.push(`<span>耗时 <b>${esc(fmtDur(s.durationMs))}</b></span>`);
    bits.push(`<span>记录 <b>${s.recordCount}</b></span>`);
    const errs = (s.logCounts && (s.logCounts.error + s.logCounts.warn)) || 0;
    if (errs) bits.push(`<span>warn/error <b>${errs}</b></span>`);
    if (s.resultCount) bits.push(`<span>结果 <b>${s.resultCount}</b></span>`);
    if (s.tags && s.tags.length) bits.push(`<span>tags <b>${s.tags.map(esc).join(", ")}</b></span>`);
    if (s.failureSummary) bits.push(`<span style="color:#ff8368">失败原因 <b>${esc(s.failureSummary)}</b></span>`);
    if (s.lastError) bits.push(`<span style="color:#ff8368">最后错误 <b>${esc(s.lastError)}</b></span>`);
    $("rMeta").innerHTML = bits.join("");

    const p = s.progress;
    const bar = $("rProgress"), label = $("rProgressLabel");
    if (p && p.percent != null) {
      bar.classList.remove("indet");
      bar.firstElementChild.style.width = p.percent + "%";
      label.textContent = Math.round(p.percent) + "%";
    } else if (p) {
      bar.classList.add("indet");
      bar.firstElementChild.style.width = "35%";
      label.textContent = p.phase || "…";
    } else {
      bar.classList.remove("indet");
      bar.firstElementChild.style.width = "0%";
      label.textContent = "";
    }
    if (p && p.phase) {
      const step = p.step != null ? (p.totalSteps ? ` ${p.step}/${p.totalSteps}` : ` #${p.step}`) : "";
      bar.title = p.phase + step + (p.message ? " — " + p.message : "");
    } else bar.title = "";
  }

  function entryHtml(r) {
    const when = `<div class="when">${esc(r.ts ? clock(r.ts) : "")}<br><span class="muted" style="font-size:10px">#${esc(r.seq)}</span></div>`;
    let body = "";

    if (r.kind === "start") {
      body = `<span class="kind start">start</span><span class="msg"><b>${esc(r.title)}</b></span>` +
        ((r.agent || r.task) ? `<div class="sub">${esc(r.agent || "")}${r.agent && r.task ? " · " : ""}${esc(r.task || "")}</div>` : "") +
        details("metadata", r.metadata);
    } else if (r.kind === "progress") {
      const pct = r.percent != null ? `${esc(r.percent)}%` : "…";
      const step = r.step != null ? ` <span class="muted">step ${esc(r.step)}${r.totalSteps ? "/" + esc(r.totalSteps) : ""}</span>` : "";
      body = `<span class="kind progress">progress</span><span class="msg"><b>${esc(r.phase)}</b> <span class="muted">${pct}</span>${step}</span>` +
        (r.message ? `<div class="sub">${esc(r.message)}</div>` : "") +
        (r.percent != null ? `<div class="mini-progress"><i style="width:${esc(r.percent)}%"></i></div>` : "") +
        details("detail", r.detail);
    } else if (r.kind === "status") {
      body = `<span class="kind status">status</span><span class="chip ${esc(r.status)}">${esc(r.status)}</span>` +
        (r.message ? `<div class="sub">${esc(r.message)}</div>` : "") + details("detail", r.detail);
    } else if (r.kind === "log") {
      body = `<span class="kind log">log</span><span class="lv ${esc(r.level)}">${esc(r.level)}</span>` +
        `<span class="msg">${esc(r.message)}</span>` + details("detail", r.detail);
    } else if (r.kind === "result") {
      const metrics = (r.metrics || []).map((m) =>
        `<div class="metric"><div class="k">${esc(m.name)}${m.hint ? " · " + esc(m.hint) : ""}</div>
         <div class="v">${esc(m.value)}${m.unit ? `<span class="u">${esc(m.unit)}</span>` : ""}</div></div>`).join("");
      const mdBlock = r.markdown ? `<div class="md-body">${renderMarkdown(r.markdown)}</div>` : "";
      const htmlBlock = r.html ? htmlIframe(r.html) : "";
      const arts = (r.artifacts || []).map((a, i) => {
        const target = a.url || a.path || "";
        const nm = target ? (a.url
          ? `<a class="nm" href="${esc(a.url)}" target="_blank" rel="noreferrer">${esc(a.name)}</a>`
          : `<span class="nm">${esc(a.name)}</span>`) : `<span class="nm">${esc(a.name)}</span>`;
        const inline = inlineAsset(r, a, i);
        const block = inline
          ? (inline.kind === "image"
              ? `<img class="artimg" loading="lazy" src="${esc(inline.href)}" alt="${esc(a.name)}">`
              : inline.kind === "md"
                ? `<div class="md-body" data-md-src="${esc(inline.href)}"><span class="muted">加载文件中…</span></div>`
                : `<div class="htmlslot" data-html-src="${esc(inline.href)}"><span class="muted">加载中…</span></div>`)
          : "";
        const pth = inline ? "" : (a.url && a.path ? `<span class="pth">${esc(a.path)}</span>` : (a.path && !a.url ? `<span class="pth">${esc(a.path)}</span>` : ""));
        const ty = a.type && !inline ? `<span class="muted">${esc(a.type)}</span>` : "";
        return `<li>${nm}${a.description ? ` <span class="muted">— ${esc(a.description)}</span>` : ""}${ty ? " " + ty : ""}${pth ? `<br>${pth}` : ""}${block ? `<div style="flex:1 0 100%">${block}</div>` : ""}</li>`;
      }).join("");
      const links = (r.links || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)}</a>`).join("");
      body = `<div class="result-card">
        <span class="kind result">result</span><h4 style="display:inline">${esc(r.title)}</h4>
        ${r.summary ? `<div class="sum">${esc(r.summary)}</div>` : ""}
        ${mdBlock}${htmlBlock}
        ${metrics ? `<div class="metrics">${metrics}</div>` : ""}
        ${arts ? `<ul class="art">${arts}</ul>` : ""}
        ${links ? `<div class="links">${links}</div>` : ""}
        ${details("data", r.data)}
      </div>`;
    } else if (r.kind === "end") {
      body = `<span class="kind end">end</span><span class="chip ${esc(r.status)}">${esc(r.status)}</span>` +
        (r.durationMs != null ? ` <span class="muted">耗时 ${esc(fmtDur(r.durationMs))}</span>` : "") +
        (r.summary ? `<div class="sub">${esc(r.summary)}</div>` : "");
    } else {
      body = `<span class="kind log">${esc(r.kind)}</span><span class="msg">${esc(pretty(r))}</span>`;
    }

    return `<div class="entry">${when}<div class="body">${body}</div></div>`;
  }

  function renderTimeline() {
    const box = $("timeline");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const rows = state.records.filter((r) => {
      if (state.filter === "all") return true;
      if (state.filter === "log") return r.kind === "log";
      if (state.filter === "progress") return r.kind === "progress";
      if (state.filter === "result") return r.kind === "result";
      if (state.filter === "status") return r.kind === "status" || r.kind === "start" || r.kind === "end";
      return true;
    });
    if (!rows.length) {
      box.innerHTML = `<div class="muted" style="padding:24px 0">还没有记录${state.filter !== "all" ? "（当前筛选：" + esc(state.filter) + "）" : ""}。agent 调用 report_* 工具后会实时出现。</div>`;
      return;
    }
    box.innerHTML = rows.map(entryHtml).join("");
    hydrate(box);
    if (state.follow && atBottom) box.scrollTop = box.scrollHeight;
  }

  /* ---------------- "我的面板" — static sites double as a bookmark page for local live panels ---------------- */

  function initMyPanels() {
    const KEY = "report-mcp.myPanels";
    $("myPanels").classList.remove("hidden");
    const load = () => {
      try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; }
      catch { return []; }
    };
    const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* private mode */ } };
    const renderMp = () => {
      $("mpList").innerHTML = load().map((u, i) =>
        `<a class="mp-item" href="${esc(u)}" target="_blank" rel="noreferrer noopener">` +
        `<span style="flex:1">${esc(u)}</span><button class="mp-del" data-i="${i}" title="移除">×</button></a>`).join("");
      $("mpList").querySelectorAll(".mp-del").forEach((b) =>
        b.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const v = load();
          v.splice(Number(b.dataset.i), 1);
          save(v);
          renderMp();
        }));
    };
    const add = () => {
      let u = null;
      try { u = new URL($("mpUrl").value.trim()); } catch { /* not a URL */ }
      if (!u || (u.protocol !== "http:" && u.protocol !== "https:")) {
        $("mpList").innerHTML = '<div class="mp-err">请输入 http(s) 地址</div>';
        return;
      }
      const v = load();
      if (!v.includes(u.origin)) { v.push(u.origin); save(v); }
      $("mpUrl").value = "";
      renderMp();
    };
    $("mpAdd").addEventListener("click", add);
    $("mpUrl").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
    renderMp();
  }

  /* ---------------- wiring ---------------- */

  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    state.filter = b.dataset.f;
    $("filters").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    renderTimeline();
  });

  $("followBtn").addEventListener("click", () => {
    state.follow = !state.follow;
    $("followBtn").classList.toggle("on", state.follow);
    if (state.follow) { const t = $("timeline"); t.scrollTop = t.scrollHeight; }
  });

  $("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); $("copyBtn").textContent = "已复制"; }
    catch { $("copyBtn").textContent = "复制失败"; }
    setTimeout(() => { $("copyBtn").textContent = "复制链接"; }, 1500);
  });

  window.addEventListener("hashchange", () => {
    const m = /#\/run\/([^/]+)/.exec(location.hash);
    const id = m ? decodeURIComponent(m[1]) : null;
    if (id && id !== state.runId) open(id, false);
  });

  await DS.detect();
  if (DS.kind === "static") {
    $("modeChip").classList.remove("hidden");
    $("homePath").textContent = "演示数据 · 静态站点（无后端）";
    initMyPanels();
  } else {
    fetch("/api/health").then((r) => r.json()).then((d) => { if (d.home) $("homePath").textContent = d.home; }).catch(() => {});
  }

  const m = /#\/run\/([^/]+)/.exec(location.hash);
  if (m) open(decodeURIComponent(m[1]), false);
  else await loadRuns();

  // Safety net: full resync even if an fs.watch event or the SSE socket was lost.
  if (DS.kind === "live") {
    setInterval(() => { loadRuns(); if (state.runId) loadRun(state.runId); }, 15000);
  }
})();
</script>
</body>
</html>
