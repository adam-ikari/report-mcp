<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything
     other than 0 on a notched device; without it the inset rules below are
     silently inert. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agent Report</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --panel-2: #1b212a;
    --line: #262e39;
    --text: #dce3ec;
    --muted: #8794a5;
    --accent: #4c9aff;
    --green: #36b37e;
    --amber: #ffab00;
    --red: #ff5630;
    --purple: #b57aff;
    --gray: #6b7684;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Stops iOS Safari inflating text in landscape, which would break the two-pane fit. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The panel owns its own scroll containers; page-level rubber-banding only
       ever shows the empty body behind them. */
    overscroll-behavior: none;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  /* dvh (not vh): mobile browsers grow/shrink the viewport as their URL bar
     slides, and a vh-sized grid leaves the last rows under the bar. */
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh; }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 3px rgba(54,179,126,.18); }
  .run-list { overflow-y: auto; flex: 1; padding: 8px; }

  /* ---------- run groups (project buckets in the sidebar) ---------- */
  .rgroup { margin-bottom: 2px; }
  .rgroup-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: transparent; border: 0; border-radius: 6px; padding: 7px 10px;
    color: var(--muted); font: inherit; font-size: 12px; font-weight: 700;
    letter-spacing: .01em; cursor: pointer; text-align: left;
  }
  .rgroup-head:hover { background: var(--panel-2); color: var(--text); }
  .rgroup-head .caret {
    width: 0; height: 0; flex: none;
    border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transition: transform .15s ease;
  }
  .rgroup-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .rgroup-head .gname {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rgroup-head .gcount {
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0;
    color: var(--muted); background: #232b36; border-radius: 999px; padding: 1px 7px;
  }
  .rgroup-body { padding-left: 6px; border-left: 1px solid var(--line); margin-left: 10px; }
  .tagchip {
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none;
    color: var(--muted); background: #212934; border-radius: 4px; padding: 1px 5px;
  }
  .run-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 10px; color: inherit; font: inherit; margin-bottom: 4px;
  }
  .run-item:hover { background: var(--panel-2); }
  .run-item.active { background: var(--panel-2); border-color: #2f3a49; }
  .run-item .t { font-weight: 560; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .m { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; color: var(--muted); font-size: 11px; }
  /* The relative time must never break mid-phrase ("9m" / "前") when the row
     runs out of width — wrap the whole span instead. */
  .run-item .m > span:not(.chip):not(.tagchip) { white-space: nowrap; }
  .run-item .bar { height: 3px; background: #232b36; border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .run-item .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #detail { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .head { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg,#141a22,#11161d); }
  .head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .head .meta { color: var(--muted); font-size: 12px; margin-top: 7px; display: flex; gap: 16px; flex-wrap: wrap; }
  .head .meta b { color: var(--text); font-weight: 550; }

  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid transparent; text-transform: uppercase; letter-spacing: .04em;
  }
  .chip.running { background: rgba(76,154,255,.14); color: #79b6ff; border-color: rgba(76,154,255,.35); }
  .chip.waiting, .chip.blocked { background: rgba(255,171,0,.14); color: #ffc94d; border-color: rgba(255,171,0,.35); }
  .chip.error, .chip.failed { background: rgba(255,86,48,.14); color: #ff8368; border-color: rgba(255,86,48,.38); }
  .chip.done { background: rgba(54,179,126,.14); color: #5cd6a0; border-color: rgba(54,179,126,.35); }
  .chip.aborted { background: rgba(107,118,132,.16); color: #9aa6b5; border-color: rgba(107,118,132,.4); }
  .chip.demo { background: rgba(181,122,255,.16); color: #cda8ff; border-color: rgba(181,122,255,.45); cursor: default; }

  .progress-wrap { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  /* Scoped to the header bar: a bare `.progress` would also hit the `kind progress` badge. */
  .progress-wrap .progress { flex: 1; height: 7px; background: #212934; border-radius: 5px; overflow: hidden; }
  .progress-wrap .progress i { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#4c9aff); transition: width .3s; }
  .progress-wrap .progress.indet i { width: 35% !important; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  .progress-label { font-size: 12px; color: var(--muted); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { border-color: #3a4657; }
  .btn.on { background: rgba(76,154,255,.16); border-color: rgba(76,154,255,.5); color: #9cc7ff; }
  .seg { display: flex; gap: 4px; }

  .timeline { overflow-y: auto; flex: 1; padding: 18px 24px 60px; min-height: 0; }
  .entry { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px dashed #1f2732; }
  .entry:last-child { border-bottom: 0; }
  .entry .when { color: var(--muted); font-size: 11px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .entry .body { min-width: 0; }
  .kind {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 7px; border-radius: 4px; margin-right: 8px; vertical-align: 1px;
  }
  .kind.start { background: rgba(181,122,255,.16); color: #cda8ff; }
  .kind.progress { background: rgba(76,154,255,.16); color: #8bbcff; }
  .kind.status { background: rgba(255,171,0,.16); color: #ffcd57; }
  .kind.log { background: rgba(135,148,165,.16); color: #a5b1c1; }
  .kind.result { background: rgba(54,179,126,.18); color: #63dca9; }
  .kind.end { background: rgba(255,86,48,.16); color: #ff8a70; }
  .lv { font-size: 11px; font-weight: 700; margin-right: 6px; }
  .lv.debug { color: var(--gray); } .lv.info { color: var(--accent); }
  .lv.warn { color: var(--amber); } .lv.error { color: var(--red); }
  .msg { word-break: break-word; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-word; }

  details { margin-top: 7px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  details summary:hover { color: var(--text); }
  pre {
    margin: 7px 0 0; padding: 10px 12px; background: #0b0f14; border: 1px solid var(--line);
    border-radius: 7px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    color: #b9c5d4; max-height: 340px;
  }

  .mini-progress { margin-top: 7px; height: 5px; background: #212934; border-radius: 4px; overflow: hidden; max-width: 420px; }
  .mini-progress i { display: block; height: 100%; background: var(--accent); }

  .result-card {
    background: linear-gradient(180deg,#16231d,#131a20); border: 1px solid rgba(54,179,126,.32);
    border-radius: 10px; padding: 14px 16px; margin-top: 4px;
  }
  .result-card h4 { margin: 0; font-size: 14px; color: #7ee6b8; }
  .result-card .sum { margin-top: 7px; color: #cfd8e3; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .metric { background: #101820; border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; min-width: 120px; }
  .metric .k { color: var(--muted); font-size: 11px; }
  .metric .v { font-size: 16px; font-weight: 640; font-variant-numeric: tabular-nums; }
  .metric .u { font-size: 11px; color: var(--muted); margin-left: 3px; }
  ul.art { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 6px; }
  ul.art li { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; flex-wrap: wrap; }
  ul.art .nm { color: #9cc7ff; }
  ul.art .pth { color: var(--muted); word-break: break-all; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .links a { color: var(--accent); font-size: 12.5px; }

  .artimg { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin-top: 8px; }
  .arthtml { width: 100%; min-height: 480px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-top: 8px; }
  .md-body { margin-top: 9px; color: #cfd8e3; font-size: 13.5px; }
  .md-body h3, .md-body h4, .md-body h5, .md-body h6 { margin: 12px 0 6px; color: var(--text); }
  .md-body h3 { font-size: 16px; } .md-body h4 { font-size: 15px; } .md-body h5 { font-size: 14px; }
  .md-body p { margin: 7px 0; }
  .md-body ul, .md-body ol { margin: 7px 0; padding-left: 22px; }
  .md-body li { margin: 3px 0; }
  .md-body blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid rgba(76,154,255,.5); color: var(--muted); background: rgba(76,154,255,.06); border-radius: 0 6px 6px 0; }
  .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .md-body a { color: var(--accent); }
  .md-body img { max-width: 100%; border-radius: 8px; }
  .md-body code { background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .md-body pre.mdcode { margin: 9px 0; padding: 10px 12px; background: #0b0f14; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: #b9c5d4; }
  .md-body pre.mdcode code { background: none; border: 0; padding: 0; }

  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px; max-width: 620px; }
  .empty h3 { color: var(--text); margin: 0 0 10px; }
  .empty pre { text-align: left; display: inline-block; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  #myPanels { border-bottom: 1px solid var(--line); padding: 8px 10px; }
  #myPanels .lbl { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  #myPanels .mp-add { display: flex; gap: 6px; }
  #myPanels input {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 11px; padding: 4px 8px;
  }
  #myPanels input:focus { outline: none; border-color: rgba(76,154,255,.5); }
  .mp-item {
    display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px;
    color: #9cc7ff; text-decoration: none; word-break: break-all;
  }
  .mp-item:hover { text-decoration: underline; }
  .mp-del {
    background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 4px; flex: none;
  }
  .mp-del:hover { color: var(--red); }
  .mp-err { color: #ff8368; font-size: 11px; margin-top: 5px; }

  /* ---------- mobile chrome (hidden on desktop) ---------- */
  .mobar { display: none; }
  .scrim { display: none; }

  /*
   * Phones. The panel is a read-and-watch surface: on a small screen the
   * timeline is what you came for, and a permanent sidebar above it leaves
   * about two lines. So the run list becomes an off-canvas drawer behind a
   * hamburger, and a slim bar carries "which run am I looking at" plus a way
   * back. Everything else is touch-target and overflow work — a 300px two-pane
   * grid and 12px controls do not survive a thumb.
   */
  @media (max-width: 860px) {
    /* The sidebar is out of flow (fixed) and the scrim is position:fixed too,
       so `main` is the only in-flow grid child: one row, sized to the viewport.
       minmax(0,…) keeps a long timeline from pushing the row past 100dvh. */
    #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }

    aside {
      position: fixed; z-index: 30; inset: 0 auto 0 0;
      width: min(82vw, 320px);
      max-height: none;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 0 0 40px rgba(0,0,0,.55);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #app.nav-open aside { transform: none; }
    #app.nav-open .scrim {
      display: block; position: fixed; z-index: 20; inset: 0;
      background: rgba(5,8,12,.6);
    }

    .mobar {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .mobar .mo-title {
      flex: 1; min-width: 0; font-size: 14px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .iconbtn {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; padding: 0;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text); cursor: pointer;
    }
    .iconbtn:active { background: #232b36; }
    .iconbtn svg { width: 19px; height: 19px; display: block; }

    /* The detail view is now a sibling of the bar, not the whole column. */
    #detail { flex: 1 1 auto; height: auto; }
    .head { padding: 14px 14px 12px; }
    .head h2 { font-size: 16px; }
    .head .meta { gap: 10px 14px; }

    /* Filters scroll sideways instead of wrapping into three stacked rows. */
    .toolbar {
      flex-wrap: nowrap; overflow-x: auto; gap: 6px;
      padding: 8px 12px; padding-right: max(12px, env(safe-area-inset-right));
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar .spacer, .toolbar .seg { display: contents; }
    .toolbar .btn { flex: none; min-height: 38px; padding: 8px 13px; font-size: 13px; }

    .timeline {
      padding: 14px 12px 72px;
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    .entry { grid-template-columns: 1fr; gap: 3px; padding: 11px 0; }
    .entry .when { text-align: left; }
    .run-item { padding: 12px 10px; }
    .result-card { padding: 12px 13px; }
    .arthtml { min-height: 320px; }
    .empty { padding: 24px 16px; }
    pre { max-height: 50vh; }
    /* One-line brand row: at 320px the title, chip and count must not wrap. */
    .brand { padding: 12px; }
    .brand h1 { overflow: hidden; text-overflow: ellipsis; }
    #runCount { white-space: nowrap; }
  }
</style>
</head>
<body>
<!--
  The panel is React; see panel/src. This file is deliberately just the shell:
  the stylesheet, the mount point, and the bundle tag.

  Why the CSS stays here instead of being imported from the JSX: the
  narrow-viewport rules are load-bearing and read much better next to the markup
  they target, and a <style> block applies before panel.js parses, so there is
  no unstyled flash. esbuild therefore bundles JS only.
-->
<div id="root"></div>
<script src="panel.js" defer></script>
</body>
</html>
