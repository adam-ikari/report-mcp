# report-mcp: the persistent host, in a container.
#
# This service does ONE thing: it serves the report pages. It is not the MCP server.
# The MCP server binds no port and is spawned by the agent's host over stdio, so the
# two processes meet on the volume, not on a socket:
#
#   {
#     "mcpServers": {
#       "report": {
#         "command": "docker",
#         "args": ["run", "--rm", "-i",
#                  "--entrypoint", "node",
#                  "-v", "report-mcp:/data",
#                  "-e", "REPORT_MCP_HOME=/data",
#                  "report-mcp:latest", "dist/index.js"]
#       }
#     }
#   }
#
# The `--entrypoint` override is what turns this image back into the MCP server: the
# image's own ENTRYPOINT is `report-mcp serve`, which is the host, not the transport.
#
# -i is mandatory for the MCP container: without stdin the transport has nothing to
# speak to. --rm keeps the host free of stopped containers.
#
# The volume is the whole point. Pages are written under /data/pages, journals under
# /data/runs, and /data/host.json tells the agent process which URL to hand back. So an
# agent session can end, and every page it published stays reachable — as long as this
# service stays up.
#
# One caveat worth knowing: `host.json` liveness is checked with a pid, and pids do not
# cross PID namespaces. Sharing the volume between containers therefore makes the link
# *optimistic* — if this service is stopped while an agent container still thinks the
# recorded pid is alive, the link 404s until the host comes back (the page itself is on
# the volume, so it opens as soon as `serve` runs again).
services:
  report-mcp:
    build: .
    image: report-mcp:latest
    container_name: report-mcp
    ports:
      # The reports, reachable from the LAN. Bind "127.0.0.1:7788:7788" instead if
      # only this machine should read them.
      - "7788:7788"
    environment:
      REPORT_MCP_HOME: /data
      REPORT_MCP_HOST: 0.0.0.0
      REPORT_MCP_PORT: "7788"
      # Set this when the address the human types is not the one the container can
      # discover — a reverse proxy, or a mapped port on a different host name.
      # REPORT_MCP_PUBLIC_URL: http://reports.lan.example:7788
      # `--tunnel` (REPORT_MCP_TUNNEL) is NOT wired up here: the image has no
      # cloudflared, and a quick tunnel would advertise an address this container
      # cannot be reached at anyway. Run `report-mcp serve --tunnel` on the machine
      # that has cloudflared if that is what you need.
    volumes:
      - report-mcp:/data
    # The image runs as `node` (uid 1000). A named volume is created root-owned,
    # so give it to the right uid on first run:
    #   docker volume create report-mcp
    #   docker run --rm -v report-mcp:/data alpine chown -R 1000:1000 /data
    restart: unless-stopped

volumes:
  report-mcp:
