name: Deploy report-mcp site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # dist/ and public/panel.js are committed so git installs work without
      # devDependencies (a global install never gets `tsc` or esbuild). Both
      # builds are deterministic, so any drift means the source changed without
      # a rebuild — fail rather than ship a package whose bin runs yesterday's
      # code, or whose panel is missing.
      - name: Committed build output must match its source
        run: |
          if [ -n "$(git status --porcelain -- dist public/panel.js public/panel.js.map)" ]; then
            echo "::error::dist/ or public/panel.js is out of sync with src/ or panel/src. Run 'npm run build' and commit it."
            git status --porcelain -- dist public/panel.js public/panel.js.map
            git diff -- dist public/panel.js public/panel.js.map
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Regenerates public/demo-data.js and copies public/ into
      # docs/public/panel/ so the demo ships at <site>/panel/. Zero-dependency:
      # both scripts import only node builtins and local files, so the root
      # install already done by `test` is not required here.
      - name: Stage panel demo into the docs site
        run: npm run docs:stage

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs site
        working-directory: docs
        run: npm ci && npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # VitePress output: docs site at the root, panel demo at /panel/.
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
