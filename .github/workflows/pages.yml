name: Deploy report-mcp site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The renderer is upstream's generated bundle, pinned by sha256. A byte that
      # changes without the manifest changing is either tampering or a bad upgrade.
      - name: Vendored renderer must match its manifest
        run: node scripts/check-vendor.mjs
      # dist/ is committed so git installs work without devDependencies (a global
      # install never gets `tsc`). The build is deterministic, so any drift means the
      # source changed without a rebuild — fail rather than ship a package whose bin
      # runs yesterday's code.
      - name: Committed build output must match its source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit it."
            git status --porcelain -- dist
            git diff -- dist
            exit 1
          fi
      # docs/public/reports/ is committed too, and it is the only end-to-end proof that
      # the vendored renderer still renders: regenerate and compare instead of trusting it.
      - name: Example reports must match their drafts
        run: node scripts/render-samples.mjs --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs site
        working-directory: docs
        run: npm ci && npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # VitePress output: docs site at the root, example reports under /reports/.
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
